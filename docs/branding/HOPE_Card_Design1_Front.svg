<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#7F00FF"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="15%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#7F00FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#070B16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#070B16" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1050" height="600" fill="#070B16"/>
  <rect width="1050" height="600" fill="url(#glowViolet)"/>
  <rect width="1050" height="600" fill="url(#glowCyan)"/>

  <!-- Circuit Trace Elements -->
  <g opacity="0.35">
    <path d="M1050 80 H820 L750 150 H550" stroke="url(#neonGrad)" stroke-width="2.5" stroke-dasharray="6 6" fill="none"/>
    <path d="M1050 180 H880 L820 240 H640" stroke="url(#neonGrad)" stroke-width="3" fill="none"/>
    <path d="M0 500 H200 L260 440 H450" stroke="url(#neonGrad)" stroke-width="2.5" stroke-dasharray="8 4" fill="none"/>
    <circle cx="550" cy="150" r="5" fill="#00F2FE"/>
    <circle cx="640" cy="240" r="6" fill="#7F00FF"/>
    <circle cx="450" cy="440" r="5" fill="#00F2FE"/>
  </g>

  <!-- Branding: Logo Icon -->
  <g transform="translate(80, 80)">
    <!-- Glowing bracket container -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="#0E1626" stroke="url(#neonGrad)" stroke-width="3" filter="url(#neonBlur)"/>
    <text x="50" y="65" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="48" font-weight="800" fill="#FFFFFF" text-anchor="middle">
      <tspan fill="#7F00FF">{</tspan>H<tspan fill="#00F2FE">}</tspan>
    </text>

    <!-- Company Name & Subtitle -->
    <text x="135" y="55" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="1">HOPE</text>
    <text x="135" y="88" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="22" font-weight="600" fill="#00F2FE" letter-spacing="4">WEB DEVELOPMENT</text>
  </g>

  <!-- Tagline / Code Motif -->
  <g transform="translate(80, 480)">
    <text font-family="'JetBrains Mono', monospace" font-size="19" fill="#00F2FE" opacity="0.9">&lt;innovative-digital-solutions&gt;</text>
    <text y="28" font-family="'JetBrains Mono', monospace" font-size="16" fill="#64748B">// Precision Engineered Web Architecture</text>
  </g>

  <!-- QR Code Module -->
  <g transform="translate(820, 370)">
    <rect x="-15" y="-15" width="150" height="165" rx="16" fill="#090E1A" stroke="#00F2FE" stroke-width="2" stroke-opacity="0.4"/>
    <!-- QR Grid -->
    <rect x="0" y="0" width="120" height="120" fill="#070B16"/>
    <!-- Position 1 -->
    <rect x="5" y="5" width="30" height="30" stroke="#00F2FE" stroke-width="4" fill="none"/>
    <rect x="13" y="13" width="14" height="14" fill="#00F2FE"/>
    <!-- Position 2 -->
    <rect x="85" y="5" width="30" height="30" stroke="#00F2FE" stroke-width="4" fill="none"/>
    <rect x="93" y="13" width="14" height="14" fill="#00F2FE"/>
    <!-- Position 3 -->
    <rect x="5" y="85" width="30" height="30" stroke="#00F2FE" stroke-width="4" fill="none"/>
    <rect x="13" y="93" width="14" height="14" fill="#00F2FE"/>
    <!-- Pixel Matrix -->
    <rect x="45" y="10" width="10" height="10" fill="#7F00FF"/>
    <rect x="65" y="10" width="10" height="10" fill="#00F2FE"/>
    <rect x="45" y="30" width="10" height="10" fill="#00F2FE"/>
    <rect x="45" y="50" width="15" height="15" fill="#7F00FF"/>
    <rect x="70" y="50" width="10" height="10" fill="#00F2FE"/>
    <rect x="15" y="50" width="10" height="10" fill="#00F2FE"/>
    <rect x="95" y="50" width="10" height="10" fill="#7F00FF"/>
    <rect x="45" y="85" width="10" height="10" fill="#7F00FF"/>
    <rect x="65" y="95" width="15" height="15" fill="#00F2FE"/>
    <rect x="90" y="90" width="10" height="10" fill="#7F00FF"/>
    <!-- Label -->
    <text x="60" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#00F2FE" text-anchor="middle" letter-spacing="1.5">SCAN PORTFOLIO</text>
  </g>
</svg>
