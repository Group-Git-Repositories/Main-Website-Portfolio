<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600">
  <defs>
    <linearGradient id="neonGradBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#7F00FF"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1050" height="600" fill="#070B16"/>

  <!-- Card Border Accent Frame -->
  <rect x="20" y="20" width="1010" height="560" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" opacity="0.6"/>

  <!-- Top Header Row -->
  <g transform="translate(60, 75)">
    <text font-family="'JetBrains Mono', monospace" font-size="34" font-weight="700" fill="url(#neonGradBack)">{H}</text>
    <text x="65" y="-3" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">HOPE <tspan fill="#8E9BAE" font-weight="500">Web Development</tspan></text>
    <text x="930" y="-3" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#00F2FE" text-anchor="end" letter-spacing="3">CONNECT</text>
    <line x1="0" y1="25" x2="930" y2="25" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
  </g>

  <!-- Contact Cards Container -->
  <g transform="translate(60, 140)">
    
    <!-- Row 1: LinkedIn -->
    <g transform="translate(0, 0)">
      <rect width="930" height="80" rx="14" fill="#0E1626" fill-opacity="0.6" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
      <rect x="20" y="16" width="48" height="48" rx="10" fill="url(#neonGradBack)" fill-opacity="0.2"/>
      <!-- LinkedIn Icon -->
      <path d="M48 30h-6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h6c1.1 0 2-.9 2-2V32c0-1.1-.9-2-2-2zm-5 16h-2v-7h2v7zm-1-8c-.5 0-1-.5-1-1s.5-1 1-1 1 .5 1 1-.5 1-1 1zm7 8h-2v-4c0-1.2-.8-1.5-1.5-1.5s-1.5.3-1.5 1.5v4h-2v-7h2v1c.5-.8 1.5-1.2 2.5-1.2 1.5 0 2.5 1 2.5 2.5v4.7z" fill="#00F2FE"/>
      <text x="90" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#00F2FE" letter-spacing="1">LINKEDIN</text>
      <text x="260" y="47" font-family="'JetBrains Mono', monospace" font-size="21" fill="#E2E8F0">linkedin.com/company/hope-web-dev</text>
    </g>

    <!-- Row 2: Telegram -->
    <g transform="translate(0, 100)">
      <rect width="930" height="80" rx="14" fill="#0E1626" fill-opacity="0.6" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
      <rect x="20" y="16" width="48" height="48" rx="10" fill="url(#neonGradBack)" fill-opacity="0.2"/>
      <!-- Telegram Icon -->
      <path d="M44 32l-9.3 3.9c-.6.3-.6.6-.2.9l2.4 1.8 1.1 3.5c.2.4.4.4.6.2l1.7-1.6 3.5 2.6c.6.4 1.1.2 1.3-.6l2.3-11.2c.2-.9-.3-1.3-.9-1z" fill="#00F2FE"/>
      <text x="90" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#00F2FE" letter-spacing="1">TELEGRAM</text>
      <text x="260" y="47" font-family="'JetBrains Mono', monospace" font-size="21" fill="#E2E8F0">@hopewebdevelopment</text>
    </g>

    <!-- Row 3: Email -->
    <g transform="translate(0, 200)">
      <rect width="930" height="80" rx="14" fill="#0E1626" fill-opacity="0.6" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
      <rect x="20" y="16" width="48" height="48" rx="10" fill="url(#neonGradBack)" fill-opacity="0.2"/>
      <!-- Email Icon -->
      <path d="M35 34h18v12h-18z" fill="none"/>
      <path d="M35 34v12h18v-12h-18zm16 2l-7 5.7-7-5.7h14zm-14 8v-6.5l7 5.7 7-5.7v6.5h-14z" fill="#00F2FE"/>
      <text x="90" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#00F2FE" letter-spacing="1">EMAIL</text>
      <text x="260" y="47" font-family="'JetBrains Mono', monospace" font-size="21" fill="#E2E8F0">contact@hopewebdev.com</text>
    </g>

    <!-- Row 4: Phone -->
    <g transform="translate(0, 300)">
      <rect width="930" height="80" rx="14" fill="#0E1626" fill-opacity="0.6" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
      <rect x="20" y="16" width="48" height="48" rx="10" fill="url(#neonGradBack)" fill-opacity="0.2"/>
      <!-- Phone Icon -->
      <path d="M48 44l-2.8-5.4c-.1 0-1.6.8-1.7.8-1.8.9-5.4-6.3-3.7-7.2l1.7-.8-2.8-5.4-1.7.8c-5.8 3 3.4 20.8 9.3 18.1l1.7-.8z" fill="#00F2FE"/>
      <text x="90" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#00F2FE" letter-spacing="1">PHONE</text>
      <text x="260" y="47" font-family="'JetBrains Mono', monospace" font-size="21" fill="#E2E8F0">+1 (800) 555-HOPE / direct line</text>
    </g>

  </g>
</svg>
